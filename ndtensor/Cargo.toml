[package]
build = "build.rs"
description = "An n-dimensional tensor"
name = "ndtensor"

authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = false
features = ["full"]
rustc-args = ["--cfg", "docsrs"]
version = "v{{version}}"

[package.metadata.release]
no-dev-version = true
tag-name = "{{version}}"

[lib]
bench = true
crate-type = ["cdylib", "rlib"]
doc = true
doctest = true
test = true

[[bench]]
harness = false
name = "default"

[[test]]
name = "tensor"
required-features = ["approx", "std"]

[dependencies]
ndtensor-traits = { workspace = true }
# custom
scsys = { workspace = true }
scsys-derive = { workspace = true }
# concurrency & parallelism
rayon = { optional = true, workspace = true }
# data structures
ndarray = { workspace = true }
# error-handling
thiserror = { workspace = true }
# macros & utilities
paste = { workspace = true }
smart-default = { workspace = true }
strum = { workspace = true }
# mathematics
approx = { optional = true, workspace = true }
num = { workspace = true }
num-complex = { optional = true, workspace = true }
num-traits = { workspace = true }
rustfft = { optional = true, workspace = true }
# random
getrandom = { default-features = false, optional = true, workspace = true }
rand = { optional = true, workspace = true }
rand_distr = { optional = true, workspace = true }
# serialization
serde = { features = ["derive"], optional = true, workspace = true }
serde_derive = { optional = true, workspace = true }
serde_json = { optional = true, workspace = true }
# tracing
tracing = { optional = true, workspace = true }

[dev-dependencies]
criterion = { features = ["plotters"], workspace = true }
lazy_static = { workspace = true }

[features]
default = [
  "std",
]

full = [
  "default",
  "approx",
  "complex",
  "json",
  "rand",
  "serde",
  "tracing",
]

nightly = []

# ************* [FF:Features] *************
json = [
  "alloc",
  "serde",
  "serde_json",
  "scsys/json",
]

signal = [
  "complex",
  "rustfft",
]

# ************* [FF:Dependencies] *************
std = [
  "ndtensor-traits/std",
  "alloc",
  "ndarray/std",
  "num/std",
  "num-complex?/std",
  "num-traits/std",
  "rand?/std",
  "rand?/std_rng",
  "serde/std",
  "scsys/std",
  "strum/std",
  "thiserror/std",
  "tracing?/std",
]

wasi = [
  "ndtensor-traits/wasi",
  "scsys/wasi",
]

wasm = [
  "getrandom?/wasm_js",
  "ndtensor-traits/wasm",
  "scsys/wasm",
]
# ************* [FF:Dependencies] *************
alloc = [
  "ndtensor-traits/alloc",
  "num/alloc",
  "serde?/alloc",
  "serde_json?/alloc",
  "scsys/alloc",
]

approx = [
  "dep:approx",
  "ndarray/approx",
  "ndtensor-traits/approx",
]

blas = [
  "ndarray/blas",
  "ndtensor-traits/blas",
]

complex = [
  "dep:num-complex",
]

rand = [
  "dep:rand",
  "dep:rand_distr",
  "ndtensor-traits/rand",
  "num/rand",
  "num-complex?/rand",
  "rng",
  "scsys/rand",
]

rayon = [
  "dep:rayon",
  "ndarray/rayon",
]

rng = [
  "dep:getrandom",
  "ndtensor-traits/rng",
  "rand?/small_rng",
  "rand?/thread_rng",
  "scsys/rng",
]

rustfft = ["dep:rustfft"]

serde = [
  "dep:serde",
  "dep:serde_derive",
  "ndarray/serde",
  "num/serde",
  "num-complex?/serde",
  "rand?/serde",
  "rand_distr?/serde",
  "scsys/serde",
]

serde_json = ["dep:serde_json"]

tracing = [
  "dep:tracing",
  "scsys/tracing",
]

name: Rust

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

on:
  pull_request:
    branches: [main, master]
    types: [opened, reopened, synchronize]
  push:
    branches: [main, master]
    tags: [v*.*.*, "*-nightly"]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  release:
    types: [created, edited]
  repository_dispatch:
    types: [rust, cargo-build, cargo-test, cargo-bench]
  workflow_dispatch:
    inputs:
      benchmark:
        default: false
        description: "Run benchmarks"
        required: true
        type: boolean

jobs:
  build:
    if: ${{ github.event_name != 'repository_dispatch' || github.event.action == 'cargo-build' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          target: ${{ matrix.target }}
      - name: Build the workspace
        run: cargo build --release --locked --workspace --features full --target ${{ matrix.target }}
  benchmark:
    if: ${{ github.event_name != 'repository_dispatch' || github.event.action == 'cargo-bench' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.cargo-bench.outputs.digest }}
      id: ${{ steps.cargo-bench.outputs.id }}
      url: ${{ steps.cargo-bench.outputs.url }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          repository: ${{ github.repository }}
      - name: Benchmark the workspace
        id: cargo-bench
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: cargo-bench
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
          token: ${{ github.token }}
  test:
    if: ${{ github.event_name != 'repository_dispatch' || github.event.action == 'cargo-test' }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [full, default]
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          target: ${{ matrix.target }}
      - name: Test (${{ matrix.features }})
        if: matrix.features != 'default' && matrix.features != 'all'
        run: cargo test -r --locked --workspace --target ${{ matrix.target }} --features ${{ matrix.features }}
      - name: Test (default)
        if: matrix.features == 'default'
        run: cargo test -r --locked --workspace --target ${{ matrix.target }}

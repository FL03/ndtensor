[package]
build = "build.rs"
description = "Traits for n-dimensional tensor"
name = "ndtensor-traits"

authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = false
features = ["full"]
rustc-args = ["--cfg", "docsrs"]
version = "v{{version}}"

[package.metadata.release]
no-dev-version = true
tag-name = "{{version}}"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
bench = false
doctest = true
test = true

[[test]]
name = "ndtensor"
required-features = ["approx", "std"]

[dependencies]
ndarray = { workspace = true }
# error-handling
thiserror = { workspace = true }
# mathematics
approx = { optional = true, workspace = true }
num-complex = { optional = true, workspace = true }
num-traits = { workspace = true }
# random
getrandom = { default-features = false, optional = true, workspace = true }
rand = { optional = true, workspace = true }
rand_distr = { optional = true, workspace = true }

[features]
default = ["std"]

full = [
  "default",
  "approx",
  "complex",
  "rand",
]

nightly = []

# ************* [FF:Dependencies] *************
std = [
  "alloc",
  "approx?/std",
  "ndarray/std",
  "num-complex?/std",
  "num-traits/std",
  "rand?/std",
  "rand?/std_rng",
]

wasi = []

wasm = [
  "getrandom?/wasm_js",
]

# ************* [FF:Dependencies] *************

alloc = []

approx = [
  "dep:approx",
  "ndarray/approx",
]

blas = [
  "ndarray/blas",
]

complex = ["dep:num-complex"]

rand = [
  "dep:rand",
  "dep:rand_distr",
  "num-complex?/rand",
  "rng",
]

rng = [
  "dep:getrandom",
  "rand?/small_rng",
  "rand?/thread_rng",
]
